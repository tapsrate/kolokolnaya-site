<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ваш отзыв</title><style>*{box-sizing:border-box}body{min-width:320px;min-height:100svh;margin:0;display:grid;place-items:center;background:#25170e url('./задний фон.png') center/cover fixed;color:#111;font-family:Arial,sans-serif}main{width:min(78vw,580px);padding:42px 0}.card{text-align:center;padding:27px 20px 25px;border-radius:34px;background:#f8eee8df;backdrop-filter:blur(14px);box-shadow:0 24px 55px #0007}.icon{width:62px;height:62px;border:2px solid;border-radius:50%;display:grid;place-items:center;margin:auto;font-size:34px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.25em;margin:19px 0 13px}.place{font-size:17px;font-weight:700}.rule{height:1px;width:48px;background:#111;margin:19px auto 24px}h1{font:clamp(34px,9vw,54px)/1 Georgia,serif;letter-spacing:-.06em;margin:0}.lead{font-size:16px;line-height:1.4;color:#666;margin:20px 0 25px}.buttons{display:grid;gap:15px}.button{min-height:68px;border-radius:19px;background:#171717;color:#fff;text-decoration:none;display:flex;align-items:center;gap:14px;padding:12px 18px;font-weight:700;font-size:18px}.logo{width:38px;height:38px;display:grid;place-items:center;flex:none}.ya{border-radius:50%;background:#f43d36;font-size:27px}.gis{border-radius:13px;background:conic-gradient(#ffd52c 0 25%,#2ecb5a 0 50%,#2bbd4d 0 75%,#9be35a 0);border:2px solid #b9e548}.gis:before{content:'';width:20px;height:20px;border-radius:50%;background:#1768d7;border:2px solid #fff}.arrow{margin-left:auto;font:34px/1 Arial}.footer-rule{height:1px;width:48px;background:#777;margin:25px auto 20px}.thanks{margin:0;font:25px Georgia,serif}.thanks small{display:block;margin-top:8px;color:#666;font:16px Arial}@media(max-width:390px){main{width:82vw;padding:30px 0}.card{padding:24px 18px;border-radius:30px}.button{min-height:66px;font-size:17px}h1{font-size:34px}}</style><main><section class="card"><div class="icon">🍴</div><p class="eyebrow">ВАШ ОТЗЫВ</p><div class="place" id="place-name">Колокольная Горка</div><div class="rule"></div><h1 id="title">Поделитесь<br>впечатлением</h1><p class="lead">Это займёт меньше минуты<br>и очень поможет нам.</p><nav class="buttons"><a class="button" id="yandex-link" target="_blank"><span class="logo ya">Я</span>Яндекс Карты<span class="arrow">›</span></a><a class="button" id="twogis-link" target="_blank"><span class="logo gis"></span>2ГИС<span class="arrow">›</span></a></nav><div class="footer-rule"></div><p class="thanks">Спасибо Вам,<small>мы ценим каждого гостя</small></p></section></main><script>const p={kolokolnaya:{name:'Колокольная Горка',yandex:'https://yandex.com/maps/org/kolokolnaya_gorka/237577049377/reviews/?utm_source=nfc&utm_medium=tag',twogis:'https://2gis.ru/spb/search/%D0%9A%D0%BE%D0%BB%D0%BE%D0%BA%D0%BE%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F%20%D0%93%D0%BE%D1%80%D0%BA%D0%B0?utm_source=nfc&utm_medium=tag'},restaurant2:{name:'Ресторан №2',yandex:'',twogis:''}},x=p[new URLSearchParams(location.search).get('place')||'kolokolnaya'];if(x&&x.yandex&&x.twogis){document.title=x.name+' — Ваш отзыв';document.querySelector('#place-name').textContent=x.name;document.querySelector('#yandex-link').href=x.yandex;document.querySelector('#twogis-link').href=x.twogis}else{document.querySelector('#place-name').textContent='этой площадке';document.querySelector('#title').textContent='Ссылка пока настраивается';document.querySelector('.lead').textContent='Пожалуйста, обратитесь к сотруднику заведения.';document.querySelector('.buttons').hidden=true}</script></html>
