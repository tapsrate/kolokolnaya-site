<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202019">
  <meta name="description" content="Выберите удобный сервис, чтобы оставить отзыв о посещении.">
  <title>Ваш отзыв</title>
  <style>
    :root { color-scheme: dark; --card: rgba(30,30,28,.72); --card-border: rgba(255,255,255,.18); --muted: rgba(255,255,255,.72); --white: #fff; --shadow: 0 24px 70px rgba(0,0,0,.36); }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100svh; margin: 0; display: grid; place-items: center; overflow-x: hidden; color: var(--white); font-family: Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing: antialiased; }
    body::before { content: ""; position: fixed; z-index: -2; inset: -14px; background: url("./restaurant.jpg.png") center / cover no-repeat; filter: blur(5px); transform: scale(1.04); }
    body::after { content: ""; position: fixed; z-index: -1; inset: 0; background: linear-gradient(145deg,rgba(16,17,14,.74),rgba(14,12,11,.56)); }
    main { width: min(100%,480px); padding: 24px 18px; }
    .card { padding: 34px 24px 26px; text-align: center; border: 1px solid var(--card-border); border-radius: 28px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .eyebrow { margin: 0 0 28px; color: rgba(255,255,255,.7); font-size: 11px; font-weight: 750; letter-spacing: .16em; }
    .place-intro { margin: 0 0 4px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .place-name { display: block; margin-bottom: 28px; font-size: 16px; font-weight: 700; line-height: 1.3; }
    h1 { margin: 0; font-size: clamp(29px,8.2vw,38px); line-height: 1.07; letter-spacing: -.045em; }
    .lead { max-width: 310px; margin: 14px auto 28px; color: var(--muted); font-size: 16px; line-height: 1.48; }
    .buttons { display: grid; gap: 12px; }
    .button { min-height: 62px; display: flex; align-items: center; justify-content: center; gap: 11px; padding: 12px 18px; border: 1px solid transparent; border-radius: 17px; text-decoration: none; font-size: 16px; font-weight: 720; line-height: 1.15; transition: transform .16s ease,box-shadow .16s ease; }
    .button:hover { transform: translateY(-1px); } .button:active { transform: scale(.98); } .button:focus-visible { outline: 3px solid rgba(255,255,255,.8); outline-offset: 3px; }
    .yandex { color: #fff; background: #171717; box-shadow: 0 8px 22px rgba(0,0,0,.22); }
    .twogis { color: #1f231d; background: rgba(255,255,255,.96); box-shadow: 0 8px 22px rgba(0,0,0,.12); }
    .service-icon { width: 23px; height: 23px; flex: 0 0 23px; display: grid; place-items: center; border-radius: 50%; font-size: 14px; font-weight: 850; line-height: 1; }
    .yandex .service-icon { background: #ff4438; color: #fff; } .twogis .service-icon { background: #35a854; color: #fff; font-size: 12px; }
    .thanks { margin: 25px 0 0; color: rgba(255,255,255,.63); font-size: 13px; line-height: 1.45; }
    .is-unavailable .buttons { display: none; } .is-unavailable .lead { margin-bottom: 0; }
    @media (max-width: 360px) { main { padding-inline: 12px; } .card { padding: 29px 18px 23px; border-radius: 24px; } .eyebrow { margin-bottom: 23px; } .place-name { margin-bottom: 23px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">ВАШ ОТЗЫВ</p>
      <p class="place-intro">Вы оставляете отзыв о</p>
      <strong class="place-name" id="place-name">заведении</strong>
      <h1 id="page-title">Как прошло ваше посещение?</h1>
      <p class="lead" id="lead">Выберите удобный сервис — это займёт меньше минуты.</p>
      <nav class="buttons" aria-label="Сервисы для отзыва">
        <a class="button yandex" id="yandex-link" href="#" target="_blank" rel="noopener noreferrer"><span class="service-icon" aria-hidden="true">Я</span><span>Яндекс Карты</span></a>
        <a class="button twogis" id="twogis-link" href="#" target="_blank" rel="noopener noreferrer"><span class="service-icon" aria-hidden="true">2ГИС</span><span>2ГИС</span></a>
      </nav>
      <p class="thanks">Спасибо за обратную связь ❤️</p>
    </section>
  </main>
  <script>
    /* Для нового заведения добавьте в places ещё один блок. NFC-ссылка: .../?place=restaurant2 */
    const places = {
      kolokolnaya: {
        name: "Колокольная Горка",
        yandex: "https://yandex.com/maps/org/kolokolnaya_gorka/237577049377/reviews/?utm_source=nfc&utm_medium=tag",
        twogis: "https://2gis.ru/spb/search/%D0%9A%D0%BE%D0%BB%D0%BE%D0%BA%D0%BE%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F%20%D0%93%D0%BE%D1%80%D0%BA%D0%B0?utm_source=nfc&utm_medium=tag"
      },
      restaurant2: { name: "Ресторан №2", yandex: "", twogis: "" }
    };
    const defaultPlace = "kolokolnaya";
    const requestedPlace = new URLSearchParams(window.location.search).get("place") || defaultPlace;
    const place = places[requestedPlace];
    const card = document.querySelector(".card");
    if (place && place.yandex && place.twogis) {
      document.title = place.name + " — Ваш отзыв";
      document.querySelector("meta[name='description']").content = "Выберите сервис, чтобы оставить отзыв о «" + place.name + "».";
      document.getElementById("place-name").textContent = place.name;
      document.getElementById("yandex-link").href = place.yandex;
      document.getElementById("twogis-link").href = place.twogis;
    } else {
      card.classList.add("is-unavailable");
      document.getElementById("place-name").textContent = "этой площадке";
      document.getElementById("page-title").textContent = "Ссылка пока настраивается";
      document.getElementById("lead").textContent = "Пожалуйста, обратитесь к сотруднику заведения.";
    }
  </script>
</body>
</html>
